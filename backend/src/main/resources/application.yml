server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/localon}
    username: ${DB_USERNAME:localon}
    password: ${DB_PASSWORD:localon}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

localon:
  dataset:
    path: ${DATASET_JSON_PATH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}