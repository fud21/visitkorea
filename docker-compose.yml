services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localon
      POSTGRES_USER: localon
      POSTGRES_PASSWORD: localon
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - localon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localon -d localon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/localon
      DB_USERNAME: localon
      DB_PASSWORD: localon
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      DATASET_JSON_PATH: ${DATASET_JSON_PATH:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  localon-postgres:
